 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>process Agent — Agentic Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171B;
    --panel:#1B1E23;
    --panel-2:#20242A;
    --line:#2B2F36;
    --text:#E9E7E1;
    --muted:#8B909A;
    --amber:#E3A144;
    --teal:#4FA8A0;
    --err:#D96C6C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    display:flex;
    justify-content:center;
  }
  .shell{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(227,161,68,0.15);
    align-self:center;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:0.2px;
  }
  header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
    max-width:56ch;
  }

  .keyrow{
    margin-top:16px;
    display:flex;
    gap:8px;
  }
  .keyrow input{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 12px;
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }
  .keyrow input:focus{outline:1px solid var(--amber);}
  .keyrow .status{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--muted);
    padding:0 6px;
    white-space:nowrap;
  }
  .keyrow .status .led{width:7px;height:7px;border-radius:50%;background:var(--err);}
  .keyrow .status.ok .led{background:#6FBF7A;}

  .tools-strip{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-top:14px;
  }
  .tool-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    padding:4px 9px;
    border-radius:20px;
  }

  main{
    flex:1;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    max-width:38ch;
    font-size:13.5px;
    line-height:1.6;
  }
  .empty-state strong{color:var(--text);font-weight:500;}

  .msg{
    display:flex;
    flex-direction:column;
    max-width:82%;
  }
  .msg.user{align-self:flex-end;align-items:flex-end;}
  .msg.assistant{align-self:flex-start;align-items:flex-start;}
  .bubble{
    padding:11px 14px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .msg.user .bubble{
    background:var(--amber);
    color:#1B1204;
    border-bottom-right-radius:3px;
  }
  .msg.assistant .bubble{
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }

  .trace{
    margin-top:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    border-left:2px solid var(--teal);
    padding-left:10px;
    display:flex;flex-direction:column;gap:4px;
  }
  .trace .step{opacity:0.9;}
  .trace .step b{color:var(--teal);font-weight:500;}

  .thinking{
    display:flex;gap:5px;align-items:center;
    padding:11px 14px;
  }
  .thinking span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){animation-delay:0.15s;}
  .thinking span:nth-child(3){animation-delay:0.3s;}
  @keyframes pulse{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}

  footer{
    padding:16px 20px 22px;
    border-top:1px solid var(--line);
  }
  .composer{
    display:flex;
    gap:8px;
  }
  .composer textarea{
    flex:1;
    resize:none;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    padding:11px 13px;
    height:44px;
    line-height:1.4;
  }
  .composer textarea:focus{outline:1px solid var(--amber);}
  .composer button{
    background:var(--amber);
    color:#1B1204;
    border:none;
    border-radius:10px;
    padding:0 18px;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .composer button:disabled{opacity:0.4;cursor:default;}
  .hint{
    margin-top:8px;
    font-size:11.5px;
    color:var(--muted);
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="dot"></span><h1>process Agent</h1></div>
  </header>

  <main id="thread">
    <div class="empty-state" id="emptyState">
      <strong>No messages yet.</strong><br/>
      
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Ask process Agent anything..."></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </footer>
</div>

<script>
// ---------------------------------------------------------------
// Client-side port of tools.py — same four tools, same contract.
// ---------------------------------------------------------------
const KNOWLEDGE_BASE = {
  "about_process_bot.txt": "process Agent is an example agentic chatbot. Drop any .txt files into this\nknowledge/ folder and the agent can read them on request via the\nread_knowledge_file tool, e.g. \"read about_process_bot.txt and summarize it\"."
};

function calculator(args){
  const expr = args.expression || "";
  if(!/^[\d\s+\-*/%().]+$/.test(expr)){
    return "Error evaluating expression: only numbers and + - * / % ( ) are allowed";
  }
  try{
    // eslint-disable-next-line no-new-func
    const result = Function('"use strict"; return (' + expr + ')')();
    return String(result);
  }catch(e){
    return "Error evaluating expression: " + e.message;
  }
}

function getCurrentDatetime(){
  const now = new Date();
  return now.toLocaleString(undefined, {
    weekday:'long', year:'numeric', month:'long', day:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
}

function readKnowledgeFile(args){
  const name = (args.filename || "").split("/").pop().split("\\").pop();
  if(KNOWLEDGE_BASE[name]) return KNOWLEDGE_BASE[name].slice(0, 5000);
  return `File not found: ${name}. Available files: ${Object.keys(KNOWLEDGE_BASE)}`;
}

function webSearch(){
  return "Web search is unavailable in the browser build (no server to proxy the request around CORS). Use the Python version's web_search tool for this.";
}

const TOOL_REGISTRY = {
  calculator, get_current_datetime: getCurrentDatetime,
  read_knowledge_file: readKnowledgeFile, web_search: webSearch
};

const TOOL_SCHEMAS = [
  { type:"function", function:{ name:"calculator", description:"Evaluate a basic arithmetic expression (+, -, *, /, %, ()).",
      parameters:{ type:"object", properties:{ expression:{ type:"string", description:"e.g. '12 * (3 + 4)'" } }, required:["expression"] } } },
  { type:"function", function:{ name:"get_current_datetime", description:"Get the current date and time.",
      parameters:{ type:"object", properties:{} } } },
  { type:"function", function:{ name:"read_knowledge_file", description:"Read a text file from the local knowledge base by filename.",
      parameters:{ type:"object", properties:{ filename:{ type:"string" } }, required:["filename"] } } },
  { type:"function", function:{ name:"web_search", description:"Search the web for current information (disabled in this browser build).",
      parameters:{ type:"object", properties:{ query:{ type:"string" } }, required:["query"] } } }
];

const SYSTEM_PROMPT = `You are process Agent, an agentic AI assistant running in a browser.
You have access to tools: calculator, get_current_datetime, read_knowledge_file, web_search.
Use them whenever they would make your answer more accurate or current — do not guess at things a tool could verify.
If web_search returns an "unavailable" message, say so plainly rather than pretending you searched.
Think step by step, call tools as needed, and only give your final answer once you're confident it's correct. Be clear and concise.`;

const MODEL = "openai/gpt-oss-120b";
const MAX_ITERATIONS = 6;
const GROQ_API_KEY = "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";

let messages = [{ role:"system", content: SYSTEM_PROMPT }];

const $ = (id) => document.getElementById(id);
const thread = $("thread");
const emptyState = $("emptyState");
const input = $("input");
const sendBtn = $("send");

function addUserBubble(text){
  emptyState.remove();
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}

function addAssistantBubble(){
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="bubble thinking"><span></span><span></span><span></span></div>`;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

async function callGroq(apiKey, msgs, tools){
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + apiKey
    },
    body: JSON.stringify({ model: MODEL, messages: msgs, tools, tool_choice: tools ? "auto" : undefined })
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error(`Groq API error (${res.status}): ${errText.slice(0,300)}`);
  }
  return res.json();
}

async function runAgent(apiKey, onStep){
  for(let i=0;i<MAX_ITERATIONS;i++){
    const data = await callGroq(apiKey, messages, TOOL_SCHEMAS);
    const msg = data.choices[0].message;
    const toolCalls = msg.tool_calls;

    if(!toolCalls || toolCalls.length === 0){
      messages.push({ role:"assistant", content: msg.content || "" });
      return msg.content || "";
    }

    messages.push({
      role:"assistant",
      content: msg.content || "",
      tool_calls: toolCalls
    });

    for(const tc of toolCalls){
      const name = tc.function.name;
      let args = {};
      try{ args = JSON.parse(tc.function.arguments || "{}"); }catch(e){}
      onStep(`🔧 Calling \`${name}\`(${JSON.stringify(args)})`);
      const fn = TOOL_REGISTRY[name];
      const result = fn ? fn(args) : `Error: unknown tool '${name}'`;
      messages.push({ role:"tool", tool_call_id: tc.id, name, content: String(result) });
    }
  }
  const data = await callGroq(apiKey, [...messages, { role:"user", content:"Please give your best final answer now, without using any more tools." }], null);
  const finalText = data.choices[0].message.content || "(no response)";
  messages.push({ role:"assistant", content: finalText });
  return finalText;
}

async function handleSend(){
  const text = input.value.trim();
  const apiKey = GROQ_API_KEY;
  if(!text) return;

  addUserBubble(text);
  messages.push({ role:"user", content: text });
  input.value = "";
  sendBtn.disabled = true;

  const bubbleWrap = addAssistantBubble();
  const bubbleEl = bubbleWrap.querySelector(".bubble");
  const steps = [];

  try{
    const finalAnswer = await runAgent(apiKey, (step) => {
      steps.push(step);
    });
    bubbleWrap.innerHTML = "";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = finalAnswer;
    bubbleWrap.appendChild(bubble);
    if(steps.length){
      const trace = document.createElement("div");
      trace.className = "trace";
      trace.innerHTML = steps.map(s => `<div class="step">${s.replace(/`([^`]+)`/g,'<b>$1</b>')}</div>`).join("");
      bubbleWrap.appendChild(trace);
    }
  }catch(e){
    bubbleWrap.innerHTML = `<div class="bubble" style="color:var(--err); border-color:var(--err);">${e.message}</div>`;
  }finally{
    sendBtn.disabled = false;
    thread.scrollTop = thread.scrollHeight;
  }
}

sendBtn.addEventListener("click", handleSend);
input.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
</script>
</body>
</html>
